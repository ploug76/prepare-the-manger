function mulberry(s){return()=>{s|=0;s=s+0x6D2B79F5|0;let x=Math.imul(s^s>>>15,1|s);x=x+Math.imul(x^x>>>7,61|x)^x;return((x^x>>>14)>>>0)/4294967296}}

// ---------- layout: HUD on top, pixel play field, Peter's button cluster (JUMP big orange bottom-right, ACTION green up-left of it). No D-pad.
function layout(){
  CW=innerWidth;CH=innerHeight;DPR=Math.min(3,devicePixelRatio||1);readSafe();
  cv.width=Math.round(CW*DPR);cv.height=Math.round(CH*DPR);cv.style.width=CW+'px';cv.style.height=CH+'px';
  const L=SAFE.l,R=CW-SAFE.r,T=SAFE.t,B=CH-SAFE.b,land=CW>CH*1.05;const y={land};
  const topH=land?52:60;y.top={x:L,y:T,w:R-L,h:topH};
  y.tb=['pause','mute'].map((k,i)=>({k,x:R-6-44-50*i,y:T+(topH-44)/2,w:44,h:44}));
  let fx,fy,fw,fh;
  if(!land){
    const ph=clamp(Math.round(CH*0.26),170,260);y.ctrl={x:0,y:CH-ph,w:CW,h:ph};
    const big=clamp(Math.max(ph*0.36,CW*0.26),92,124),sm=Math.round(big*0.84),bot=clamp(ph*0.14,18,46)+SAFE.b;
    // Peter Oct 31 9:10 PM: NES pad - ACTION (green) left, JUMP (orange) right, level, both the old ACTION size
    y.J={cx:CW-SAFE.r-16-sm/2,cy:CH-bot-sm/2,r:sm/2};
    y.A={cx:CW-SAFE.r-16-sm-18-sm/2,cy:CH-bot-sm/2,r:sm/2};
    fx=L;fy=T+topH;fw=R-L;fh=CH-ph-fy;
    S=Math.max(2,Math.min(fw/104,fh/118));   // Vol 2 scale: hero ~ a quarter of the view width
  }else{
    const big=clamp(CH*0.21,72,96),sm=Math.round(big*0.82);y.ctrl=null;
    y.J={cx:CW-SAFE.r-14-sm/2,cy:CH-12-SAFE.b-sm/2,r:sm/2};
    y.A={cx:CW-SAFE.r-14-sm-16-sm/2,cy:CH-12-SAFE.b-sm/2,r:sm/2};
    fx=L;fy=T+topH;fw=R-L;fh=B-fy;
    S=Math.max(2,Math.min(fw/230,CH*0.205/26,fh/96));   // Vol 2 scale: hero ~20% of screen height
  }
  VW=Math.floor(Math.min(fw/S,440));VH=Math.floor(Math.min(fh/S,260));
  y.field={x:Math.round(fx+(fw-VW*S)/2),y:Math.round(fy+(fh-VH*S)/2),w:VW*S,h:VH*S};
  RS=Math.min(S*DPR,2400/VW,2400/VH);off.width=Math.round(VW*RS);off.height=Math.round(VH*RS);LY=y;
}
// ---------- drawing helpers (main canvas, CSS px). Text is never smaller than 16px; tap targets never smaller than 44px.
function rr(x,y,w,h,r){g.beginPath();g.moveTo(x+r,y);g.arcTo(x+w,y,x+w,y+h,r);g.arcTo(x+w,y+h,x,y+h,r);g.arcTo(x,y+h,x,y,r);g.arcTo(x,y,x+w,y,r);g.closePath()}
let MINFONT=99;
function txt(s,x,y,size,col,al='center',o2={}){size=Math.max(16,size);MINFONT=Math.min(MINFONT,size);g.font=(o2.w||'bold')+' '+size+'px '+FONT;g.textAlign=al;g.textBaseline=o2.bl||'middle';
  if(o2.st!==0){g.lineWidth=o2.lw||Math.max(3,size/5);g.strokeStyle=o2.st||'rgba(10,8,30,.9)';g.lineJoin='round';g.strokeText(s,x,y)}g.fillStyle=col;g.fillText(s,x,y)}
function fitSize(s,maxW,size,min=16){g.font='bold '+size+'px '+FONT;while(size>min&&g.measureText(s).width>maxW){size--;g.font='bold '+size+'px '+FONT}return size}
function wrap(s,maxW,size){size=Math.max(16,size);g.font='bold '+size+'px '+FONT;const out=[];for(const para of String(s).split('\n')){const w=para.split(' ');let l='';for(const x of w){const tt=l?l+' '+x:x;if(g.measureText(tt).width>maxW&&l){out.push(l);l=x}else l=tt}out.push(l)}return out}
function mix(hex,k){const n=parseInt(hex.slice(1),16);let r=(n>>16)&255,gg=(n>>8)&255,b=n&255;const f=v=>Math.round(k>0?v+(255-v)*k:v*(1+k));return 'rgb('+f(r)+','+f(gg)+','+f(b)+')'}
function button(id,x,y,w,h,label,col,fn,size=19){w=Math.max(44,w);h=Math.max(44,h);const hot=pressBtn===id,yy=y+(hot?2:0);
  g.save();g.shadowColor='rgba(0,0,0,.5)';g.shadowBlur=10;g.shadowOffsetY=hot?2:5;rr(x,yy,w,h,14);g.fillStyle=mix(col,-0.35);g.fill();g.restore();
  const gr=g.createLinearGradient(0,yy,0,yy+h);gr.addColorStop(0,mix(col,0.28));gr.addColorStop(0.5,col);gr.addColorStop(1,mix(col,-0.3));rr(x,yy,w,h,14);g.fillStyle=gr;g.fill();
  g.save();rr(x+3,yy+3,w-6,h*0.42,11);g.clip();const sh=g.createLinearGradient(0,yy,0,yy+h*0.45);sh.addColorStop(0,'rgba(255,255,255,.32)');sh.addColorStop(1,'rgba(255,255,255,0)');g.fillStyle=sh;g.fillRect(x,yy,w,h);g.restore();
  rr(x,yy,w,h,14);g.lineWidth=2.5;g.strokeStyle='rgba(255,236,170,.95)';g.stroke();rr(x+3.5,yy+3.5,w-7,h-7,11);g.lineWidth=1;g.strokeStyle='rgba(255,255,255,.25)';g.stroke();
  const sz=fitSize(label,w-14,size);txt(label,x+w/2,yy+h/2+1,sz,'#fff','center',{st:'rgba(20,8,30,.75)',lw:Math.max(3,sz/5)});
  menuBtns.push({id,x,y,w,h,fn})}

let AC=null,MG=null,SG=null,nextNote=0,step=0,song=0;
function initAudio(){if(AC)return;try{AC=new (window.AudioContext||window.webkitAudioContext)();MG=AC.createGain();MG.gain.value=muted?0:1;MG.connect(AC.destination);
  SG=AC.createGain();SG.gain.value=0.045;SG.connect(MG);}catch(e){AC=null}}
let AUN=0,CHIMED=0,SILENT=null;
function silentWav(){const n=800,b=new Uint8Array(44+n),v=new DataView(b.buffer),w=(o2,s)=>{for(let i=0;i<s.length;i++)b[o2+i]=s.charCodeAt(i)};w(0,'RIFF');v.setUint32(4,36+n,true);w(8,'WAVEfmt ');v.setUint32(16,16,true);v.setUint16(20,1,true);v.setUint16(22,1,true);v.setUint32(24,8000,true);v.setUint32(28,8000,true);v.setUint16(32,1,true);v.setUint16(34,8,true);w(36,'data');v.setUint32(40,n,true);b.fill(128,44);let s='';for(const c of b)s+=String.fromCharCode(c);return 'data:audio/wav;base64,'+btoa(s)}
function chime(){if(!AC||muted)return;tone(1046,0.35,'sine',0.05);tone(1568,0.5,'sine',0.035,0.08)}
function unlockAudio(){try{if(navigator.audioSession&&navigator.audioSession.type!=='playback')navigator.audioSession.type='playback'}catch(e){}
  initAudio();if(!AC)return;
  if(!AUN){AUN=1;try{const b=AC.createBuffer(1,1,22050),src=AC.createBufferSource();src.buffer=b;src.connect(AC.destination);src.start(0)}catch(e){}
    try{SILENT=new Audio(silentWav());SILENT.setAttribute('playsinline','');SILENT.loop=false;SILENT.volume=0.01;const pp=SILENT.play();if(pp&&pp.catch)pp.catch(()=>{})}catch(e){}}
  const go=()=>{if(AC.state==='running'&&!CHIMED){CHIMED=1;chime()}};
  if(AC.state!=='running'){const pr=AC.resume();if(pr&&pr.then)pr.then(go).catch(()=>{})}else go()}

  gn.gain.setValueAtTime(0.0001,tt);gn.gain.exponentialRampToValueAtTime(vol,tt+0.012);gn.gain.exponentialRampToValueAtTime(0.0001,tt+dur);os.connect(gn);gn.connect(dest||MG);os.start(tt);os.stop(tt+dur+0.05)}

function musicTick(){if(!AC||muted||!musicOn||paused||state==='church'){nextNote=0;return}
