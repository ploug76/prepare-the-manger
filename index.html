// ===================== Prepare the Manger — core (canvas, layout, storage, audio) =====================
// Engine base: the Tract Attack platformer core (canvas scaling, text, buttons, Web Audio). All art and content are new.
'use strict';
const cv=document.getElementById('cv'),g=cv.getContext('2d');
const off=document.createElement('canvas');let o=off.getContext('2d');   // pixel-art world, 1 logical px, scaled up
let CW=390,CH=844,DPR=1,SAFE={t:0,r:0,b:0,l:0},LY=null,VW=160,VH=200,S=3;
let state='title',level=1,paused=false;
const LS={get(k,d){try{const v=localStorage.getItem('ptm_'+k);return v===null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem('ptm_'+k,JSON.stringify(v))}catch(e){}}};
let muted=LS.get('mute',false),musicOn=LS.get('music',true),EASY=LS.get('easy',false);
let unlocked=Math.max(1,LS.get('unlock',1));
let menuBtns=[],t=0,toastMsg='',toastT=0,pressBtn=null;
const FONT='"Trebuchet MS",system-ui,-apple-system,"Segoe UI",sans-serif';
const clamp=(v,a,b)=>v<a?a:v>b?b:v,lerp=(a,b,k)=>a+(b-a)*k,rnd=(a,b)=>a+Math.random()*(b-a),ri=(a,b)=>Math.floor(rnd(a,b+1)),pick=a=>a[Math.floor(Math.random()*a.length)];
function mulberry(s){return()=>{s|=0;s=s+0x6D2B79F5|0;let x=Math.imul(s^s>>>15,1|s);x=x+Math.imul(x^x>>>7,61|x)^x;return((x^x>>>14)>>>0)/4294967296}}
function readSafe(){try{const cs=getComputedStyle(document.getElementById('sp'));SAFE={t:parseFloat(cs.paddingTop)||0,r:parseFloat(cs.paddingRight)||0,b:parseFloat(cs.paddingBottom)||0,l:parseFloat(cs.paddingLeft)||0}}catch(e){}}
// ---------- layout: HUD on top, pixel play field, Peter's button cluster (JUMP big orange bottom-right, ACTION green up-left of it). No D-pad.
function layout(){
  CW=innerWidth;CH=innerHeight;DPR=Math.min(3,devicePixelRatio||1);readSafe();
  cv.width=Math.round(CW*DPR);cv.height=Math.round(CH*DPR);cv.style.width=CW+'px';cv.style.height=CH+'px';
  const L=SAFE.l,R=CW-SAFE.r,T=SAFE.t,B=CH-SAFE.b,land=CW>CH*1.05;const y={land};
  const topH=land?52:60;y.top={x:L,y:T,w:R-L,h:topH};
  y.tb=['pause','mute'].map((k,i)=>({k,x:R-6-44-50*i,y:T+(topH-44)/2,w:44,h:44}));
  let fx,fy,fw,fh;
  if(!land){
    const ph=clamp(Math.round(CH*0.26),170,260);y.ctrl={x:0,y:CH-ph,w:CW,h:ph};
    const big=clamp(Math.max(ph*0.36,CW*0.26),92,124),sm=Math.round(big*0.84),bot=clamp(ph*0.14,18,46)+SAFE.b;
    y.J={cx:CW-SAFE.r-16-big/2,cy:CH-bot-big/2,r:big/2};
    let oy=CH-bot-big*0.42-sm/2;if(oy-sm/2<CH-ph+8)oy=CH-ph+8+sm/2;
    y.A={cx:CW-SAFE.r-16-big-14-sm/2,cy:oy,r:sm/2};
    fx=L;fy=T+topH;fw=R-L;fh=CH-ph-fy;
    S=Math.max(2,Math.min(fw/128,fh/140));
  }else{
    const big=clamp(CH*0.21,72,96),sm=Math.round(big*0.82);y.ctrl=null;
    y.J={cx:CW-SAFE.r-14-big/2,cy:CH-12-SAFE.b-big/2,r:big/2};
    y.A={cx:CW-SAFE.r-14-big-10-sm/2,cy:CH-12-SAFE.b-big*0.18-sm/2,r:sm/2};
    fx=L;fy=T+topH;fw=R-L;fh=B-fy;
    S=Math.max(2,Math.min(fw/300,fh/160));
  }
  VW=Math.floor(Math.min(fw/S,440));VH=Math.floor(Math.min(fh/S,260));
  y.field={x:Math.round(fx+(fw-VW*S)/2),y:Math.round(fy+(fh-VH*S)/2),w:VW*S,h:VH*S};
  off.width=VW;off.height=VH;LY=y;
}
// ---------- drawing helpers (main canvas, CSS px). Text is never smaller than 16px; tap targets never smaller than 44px.
function rr(x,y,w,h,r){g.beginPath();g.moveTo(x+r,y);g.arcTo(x+w,y,x+w,y+h,r);g.arcTo(x+w,y+h,x,y+h,r);g.arcTo(x,y+h,x,y,r);g.arcTo(x,y,x+w,y,r);g.closePath()}
let MINFONT=99;
function txt(s,x,y,size,col,al='center',o2={}){size=Math.max(16,size);MINFONT=Math.min(MINFONT,size);g.font=(o2.w||'bold')+' '+size+'px '+FONT;g.textAlign=al;g.textBaseline=o2.bl||'middle';
  if(o2.st!==0){g.lineWidth=o2.lw||Math.max(3,size/5);g.strokeStyle=o2.st||'rgba(10,8,30,.9)';g.lineJoin='round';g.strokeText(s,x,y)}g.fillStyle=col;g.fillText(s,x,y)}
function fitSize(s,maxW,size,min=16){g.font='bold '+size+'px '+FONT;while(size>min&&g.measureText(s).width>maxW){size--;g.font='bold '+size+'px '+FONT}return size}
function wrap(s,maxW,size){size=Math.max(16,size);g.font='bold '+size+'px '+FONT;const out=[];for(const para of String(s).split('\n')){const w=para.split(' ');let l='';for(const x of w){const tt=l?l+' '+x:x;if(g.measureText(tt).width>maxW&&l){out.push(l);l=x}else l=tt}out.push(l)}return out}
function button(id,x,y,w,h,label,col,fn,size=19){w=Math.max(44,w);h=Math.max(44,h);const hot=pressBtn===id;rr(x,y+(hot?2:0),w,h,12);g.fillStyle='rgba(0,0,0,.35)';g.save();g.translate(0,4);g.fill();g.restore();
  rr(x,y+(hot?2:0),w,h,12);g.fillStyle=col;g.fill();g.lineWidth=3;g.strokeStyle='#fff';g.stroke();const sz=fitSize(label,w-14,size);txt(label,x+w/2,y+h/2+(hot?2:0)+1,sz,'#fff');
  menuBtns.push({id,x,y,w,h,fn})}
function toast(m,s=2.4){toastMsg=m;toastT=s}
// ---------- audio: soft original tunes + gentle sfx (Web Audio, quiet by design)
let AC=null,MG=null,SG=null,nextNote=0,step=0,song=0;
function initAudio(){if(AC)return;try{AC=new (window.AudioContext||window.webkitAudioContext)();MG=AC.createGain();MG.gain.value=muted?0:1;MG.connect(AC.destination);
  SG=AC.createGain();SG.gain.value=0.045;SG.connect(MG);}catch(e){AC=null}}
function setMute(m){muted=m;LS.set('mute',m);if(MG)MG.gain.value=m?0:1}
function tone(f,dur,type='sine',vol=0.08,when=0,dest=null,slide=0){if(!AC||muted)return;const tt=AC.currentTime+when,os=AC.createOscillator(),gn=AC.createGain();os.type=type;os.frequency.setValueAtTime(f,tt);if(slide)os.frequency.exponentialRampToValueAtTime(Math.max(40,f*slide),tt+dur);
  gn.gain.setValueAtTime(0.0001,tt);gn.gain.exponentialRampToValueAtTime(vol,tt+0.012);gn.gain.exponentialRampToValueAtTime(0.0001,tt+dur);os.connect(gn);gn.connect(dest||MG);os.start(tt);os.stop(tt+dur+0.05)}
const SFX={
  pick(){tone(880,0.1,'sine',0.05);tone(1320,0.14,'sine',0.04,0.06)},
  light(){[660,990,1320].forEach((f,i)=>tone(f,0.2,'sine',0.045,i*0.05))},
  bleat(){tone(420,0.25,'triangle',0.04,0,null,0.8);tone(400,0.2,'triangle',0.03,0.12,null,0.85)},
  place(){[523,659,784,1046].forEach((f,i)=>tone(f,0.28,'triangle',0.05,i*0.08))},
  hurt(){tone(300,0.2,'triangle',0.04,0,null,0.6)},
  jump(){tone(400,0.12,'triangle',0.035,0,null,1.6)},
  clear(){[523,659,784,659,784,1046].forEach((f,i)=>tone(f,0.3,'triangle',0.06,i*0.13))},
  tap(){tone(660,0.06,'square',0.02)},
  no(){tone(260,0.12,'triangle',0.04);tone(220,0.16,'triangle',0.04,0.1)},
  knock(){tone(150,0.07,'square',0.05);tone(150,0.07,'square',0.05,0.16)},
  gloria(){[784,988,1175,1568].forEach((f,i)=>tone(f,0.5,'sine',0.04,i*0.09))}};
// original gentle tunes (scale degrees in a major key; 0 = rest). 8th-note steps. Written for this engine; not based on any existing song.
const SONGS=[
 {bpm:84,root:60,mel:[5,0,3,5,6,5,3,0, 2,0,3,2,1,0,0,0, 3,0,5,8,7,6,5,0, 6,5,4,3,2,0,0,0, 5,0,3,5,6,5,8,0, 7,0,6,5,6,0,0,0, 5,4,3,0,4,3,2,0, 1,0,2,3,1,0,0,0],ch:[1,1,5,5,6,6,4,5]},
 {bpm:96,root:62,mel:[1,3,5,0,5,6,5,3, 4,0,6,0,5,0,0,0, 3,4,5,0,8,7,6,5, 6,0,5,0,4,3,2,0, 1,3,5,0,5,6,8,7, 6,0,4,0,6,5,0,0, 5,4,3,2,3,0,5,0, 1,0,0,0,1,0,0,0],ch:[1,4,1,5,1,4,5,1]},
 {bpm:76,root:57,mel:[3,0,2,1,2,0,3,0, 5,0,0,6,5,0,0,0, 6,0,5,3,2,0,3,0, 2,0,0,0,0,0,0,0, 3,0,2,1,2,0,3,5, 8,0,7,0,6,0,5,0, 6,5,3,2,3,0,2,0, 1,0,0,0,0,0,0,0],ch:[1,6,4,5,1,6,4,1]}];
const MAJ=[0,0,2,4,5,7,9,11,12];
function midi(n){return 440*Math.pow(2,(n-69)/12)}
function musicTick(){if(!AC||muted||!musicOn||paused||state==='church'){nextNote=0;return}
  const sg=SONGS[song%SONGS.length],dt=60/sg.bpm/2;if(!nextNote||nextNote<AC.currentTime)nextNote=AC.currentTime+0.05;
  while(nextNote<AC.currentTime+0.25){const i=step%sg.mel.length,w=nextNote-AC.currentTime,d=sg.mel[i];
    if(d)tone(midi(sg.root+12+MAJ[d]),dt*1.8,'triangle',0.32,w,SG);
    if(i%8==0){const c=sg.ch[(i/8|0)%sg.ch.length],r=sg.root+MAJ[c]-12;[0,4,7].forEach((k,j)=>tone(midi(r+(c==6||c==2||c==3?[0,3,7][j]:k)),dt*7.5,'sine',0.16,w,SG))}
    nextNote+=dt;step++}}
setInterval(musicTick,90);

// ===================== art: all original procedural pixel art (no reused sprites) =====================
function px(x,y,w,h,c){o.fillStyle=c;o.fillRect(Math.round(x),Math.round(y),w,h)}
function withCtx(ctx,fn){const p=o;o=ctx;try{fn()}finally{o=p}}
// Every sprite is drawn in RIGHT-facing coordinates through P(); f=-1 mirrors it exactly, so face, body and feet all turn together.
function mirror(x,y,f){x=Math.round(x);y=Math.round(y);return (dx,dy,w,h,c)=>px(f>0?x+dx:x-dx-w,y+dy,w,h,c)}
const LOOKS={
  mary:{robe:'#3d6fd1',robe2:'#2b56ad',veil:'#eef3ff',veil2:'#c9d6f2',skin:'#e2ae84',hair:'#4a2d1c',band:'#eef3ff',shoe:'#6b4528'},
  joseph:{robe:'#a0703e',robe2:'#7b5129',veil:'#dccb9e',veil2:'#b9a678',skin:'#c98f63',hair:'#3a2618',beard:'#3a2618',band:'#6a4422',shoe:'#4a301a'},
  shepherd:{robe:'#bda070',robe2:'#8e7448',veil:'#efe4c8',veil2:'#cbbd98',skin:'#b97a52',hair:'#2a1a10',beard:'#2a1a10',band:'#5f8a3a',shoe:'#4a301a',staff:1},
  boy:{robe:'#d8834a',robe2:'#a85f2e',veil:'#f3e7c9',veil2:'#d4c49c',skin:'#c48a5c',hair:'#24170e',band:'#3f7fbf',shoe:'#4a301a',kid:1},
  angel:{robe:'#fffdf4',robe2:'#e6dcb8',skin:'#f0c9a0',hair:'#e9c45e',band:'#f2d36b',shoe:'#e6dcb8',wings:1,halo:1,bare:1},
  wise:{robe:'#7b3fa8',robe2:'#57297d',skin:'#8a5a3a',hair:'#1d120a',beard:'#dcdcdc',band:'#f2c230',shoe:'#3a2414',crown:'#f2c230',cape:'#c0392b'},
  wise2:{robe:'#2f7f6f',robe2:'#1f5a4e',skin:'#6b4228',hair:'#120a06',beard:'#120a06',band:'#e8b030',shoe:'#3a2414',crown:'#e8b030',cape:'#d08a20'},
  wise3:{robe:'#b03a48',robe2:'#80283a',skin:'#d9a27a',hair:'#5a3a22',beard:'#8a6a4a',band:'#f2d36b',shoe:'#3a2414',crown:'#f2d36b',cape:'#3b4fa8'},
  villager:{robe:'#8a8f5a',robe2:'#666b3e',veil:'#e8dfc8',veil2:'#c4b996',skin:'#c4875a',hair:'#2a1a10',band:'#a0503a',shoe:'#4a301a'},
  villager2:{robe:'#b0606a',robe2:'#88464f',veil:'#f0e2d0',veil2:'#d0bea4',skin:'#d8a47c',hair:'#3a2618',band:'#e0c060',shoe:'#4a301a'},
  inn:{robe:'#6f7fa0',robe2:'#525f7c',skin:'#c48a5c',hair:'#4a3a2a',beard:'#6a5a4a',band:'#d0d0d0',shoe:'#3a2414'}};
// a person, side view. ph = walk phase. o2.mv = moving, o2.air = in the air
function drawChar(x,y,f,ph,L,o2={}){const P=mirror(x,y,f),k=L.kid?2:0,mv=o2.mv&&!o2.air;
  const s=mv?Math.sin(ph):0,a=o2.air?2:Math.round(s*2),arm=o2.air?1:Math.round(-s*1.5);
  if(o2.alpha!==undefined)o.globalAlpha=o2.alpha;
  if(L.wings){const up=Math.sin(t*7+(o2.wph||0))>0;const w1='#ffffff',w2='#dfe6ff';   // angel wings flap
    if(up){P(-9,-22+k,5,3,w1);P(-8,-19+k,5,3,w2);P(-6,-16+k,3,2,w2)}else{P(-9,-15+k,5,3,w1);P(-8,-12+k,4,3,w2);P(-6,-16+k,3,2,w2)}}
  if(L.cape)P(-5,-15+k,2,11-k,L.cape);
  // legs + feet: toes always point forward (dx increases toward the facing side)
  const leg=L.bare?L.skin:L.skin;
  P(-2-a,-4,2,3,leg);P(-2-a,-1,3,1,L.shoe);          // back leg, foot toe forward
  P(1+a,-4,2,3,leg);P(1+a,-1,3,1,L.shoe);P(3+a,-2,1,1,L.shoe); // front leg, foot + toe tip forward
  // robe
  P(-4,-15+k,8,11-k,L.robe);P(-5,-8,10,3,L.robe);P(-5,-5,10,1,L.robe2);P(2,-14+k,1,8-k,L.robe2);
  P(-4,-10+k,8,1,L.band);P(3,-10+k,2,2,L.band);      // belt knot at the front
  P(1+arm,-13+k,2,5,L.robe2);P(2+arm,-8+k,2,1,L.skin); // front arm + hand
  // head (eye, nose, mouth on the front side)
  const hy=-21+k;P(-3,hy,6,6,L.skin);P(3,hy+3,1,1,L.skin);P(1,hy+2,1,1,'#1b1530');
  if(L.beard){P(-1,hy+4,4,2,L.beard);P(0,hy+6,3,1,L.beard)}else P(1,hy+4,2,1,'#a5452f');
  if(L.veil){P(-4,hy-1,7,2,L.veil);P(-4,hy,3,8,L.veil);P(-4,hy+5,2,3,L.veil2);P(2,hy-1,1,1,L.veil2);if(L.band&&!L.kid&&L!==LOOKS.mary)P(-4,hy,7,1,L.band)}
  else{P(-3,hy-1,6,2,L.hair);P(-3,hy,2,4,L.hair);if(L.kid)P(2,hy-1,1,1,L.hair)}
  if(L.crown){P(-3,hy-3,6,2,L.crown);P(-3,hy-4,1,1,L.crown);P(0,hy-4,1,1,L.crown);P(2,hy-4,1,1,L.crown);P(0,hy-2,1,1,'#e03a3a')}
  if(L.halo){o.globalAlpha=(o2.alpha??1)*0.9;P(-3,hy-4,7,1,'#ffe98a');P(-4,hy-3,1,1,'#ffe98a');P(3,hy-3,1,1,'#ffe98a');o.globalAlpha=o2.alpha??1}
  if(L.staff||o2.staff){P(5,-25,1,24,'#7a5028');P(5,-26,3,1,'#7a5028');P(7,-25,1,2,'#7a5028')}
  if(o2.carry==='lamp'){P(4,-11,3,2,'#c96a3a');P(5,-13,1,2,'#ffd34a')}
  o.globalAlpha=1}
// ---------- animals: real leg motion when walking (diagonal pairs swing and lift)
function legs4(P,xs,top,h,ph,mv,col,hoof){const s=mv?Math.sin(ph):0;xs.forEach((lx,i)=>{const sw=(i===0||i===3)?s:-s,dx=Math.round(sw*1.6),lift=mv&&sw>0.35?1:0;
  P(lx+dx,top,2,h-lift,col);P(lx+dx,top+h-1-lift,2,1,hoof)})}
function drawSheep(x,y,f,ph,mv,o2={}){const P=mirror(x,y,f),c=o2.col||'#f4f1e8',c2='#dcd6c4';
  legs4(P,[-4,-2,2,4],-4,4,ph,mv,'#3a3030','#1d1818');
  const bob=mv?Math.round(Math.abs(Math.sin(ph))*0.6):0;
  P(-5,-10-bob,11,6,c);P(-4,-11-bob,9,1,c);P(-6,-9-bob,1,4,c2);P(-5,-5-bob,11,1,c2);P(-3,-12-bob,2,1,c);P(1,-12-bob,2,1,c);
  P(5,-11-bob,4,4,'#3a3030');P(8,-9-bob,1,1,'#3a3030');P(7,-10-bob,1,1,'#fff');P(5,-12-bob,1,1,'#3a3030');P(4,-10-bob,1,2,'#3a3030');
  if(o2.bow)P(3,-8-bob,2,1,o2.bow)}
function drawDonkey(x,y,f,ph,mv,o2={}){const P=mirror(x,y,f),c='#8d8478',c2='#6f675d';if(o2.rider)drawChar(x+(f>0?-1:1),y-9,f,0,LOOKS.mary,{});   // Mary sits on the donkey: drawn first so its body hides her legs
  legs4(P,[-6,-4,3,5],-8,8,ph,mv,c2,'#2a2520');
  P(-7,-15,14,7,c);P(-6,-9,12,1,'#bdb5a8');P(-8,-15,1,6,c2);P(5,-20,3,7,c);P(6,-22,6,4,c);P(10,-20,3,3,'#cfc7ba');P(12,-19,1,1,'#2a2520');
  P(6,-26,1,4,c2);P(8,-26,1,4,c2);P(9,-21,1,1,'#111');P(-1,-16,3,1,'#5a3a22');
}
function drawOx(x,y,f,ph,mv){const P=mirror(x,y,f),c='#9a5a32',c2='#7a4422';
  legs4(P,[-7,-5,4,6],-8,8,ph,mv,c2,'#2a1a10');
  P(-8,-17,17,9,c);P(-7,-8,15,1,c2);P(-9,-16,1,7,c2);P(8,-18,5,6,c);P(11,-14,3,3,'#e8c8a8');P(10,-17,1,1,'#111');P(8,-20,1,2,'#efe6c8');P(12,-20,1,2,'#efe6c8');P(-6,-18,6,1,'#b06a3e')}
function drawCamel(x,y,f,ph,mv,o2={}){const P=mirror(x,y,f),c='#c9a46a',c2='#a8854e';
  legs4(P,[-6,-4,3,5],-13,13,ph,mv,c2,'#5a4024');
  P(-7,-20,14,7,c);P(-4,-24,7,4,c);P(-2,-25,3,1,c);P(-8,-19,1,5,c2);P(6,-27,3,9,c);P(7,-29,6,4,c);P(12,-28,1,2,c2);P(10,-28,1,1,'#111');P(7,-30,1,1,c2);
  P(-6,-21,12,2,o2.blanket||'#c0392b');P(-6,-19,12,1,'#f2c230')}
